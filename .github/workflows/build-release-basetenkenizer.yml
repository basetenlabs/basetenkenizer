name: Build and Release basetenkenizer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI and crates.io?"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-package:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-maturin.yml
    with:
      publish_pypi: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.publish) }}
    secrets:
      PYPI_BASETENKENIZER_TOKEN: ${{ secrets.PYPI_BASETENKENIZER_TOKEN }}

  crates-io:
    name: Publish basetenkenizer to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@40e53bf063d4f87f0a6e0a83231c09bcfb22bc19 # v6
      - uses: chainguard-actions/dtolnay-rust-toolchain@7b7b95556805186e9eb5b44efdafea3a47dbaa56 # v1
        with:
          toolchain: stable
      - name: Verify package
        run: cargo publish -p basetenkenizer --dry-run --locked
      - name: Publish
        if: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.publish) }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_PUBLISH_BASETENKENIZER }}
        run: cargo publish -p basetenkenizer --locked
