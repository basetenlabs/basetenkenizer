name: Python CI

on:
  push:
    branches: [main, release/basetenkenizer]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@40e53bf063d4f87f0a6e0a83231c09bcfb22bc19 # v6

      - uses: chainguard-actions/dtolnay-rust-toolchain@7b7b95556805186e9eb5b44efdafea3a47dbaa56 # v1
        with:
          toolchain: stable

      - uses: chainguard-actions/Swatinem-rust-cache@b83da835517599f3f42d100dde7195b7edfb9e30 # v2.9.3

      - uses: chainguard-actions/actions-setup-python@ace3254bb5011efbd0650a7120a0441ebd1f9400 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Hugging Face tokenizers
        uses: chainguard-actions/actions-cache@1a492a110f951652a0d2d3327bc20ee36867788e # v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/huggingface/xet
            ~/.cache/tokenizers
          key: ${{ runner.os }}-py3.12-hf-tokenizers-${{ hashFiles('pyproject.toml', 'python/Cargo.toml', 'Cargo.lock', '.github/workflows/python-ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-py3.12-hf-tokenizers-
            ${{ runner.os }}-hf-tokenizers-

      - name: Configure Hugging Face token
        run: |
          if [ -n "${HF_TOKEN:-}" ]; then
            mkdir -p ~/.cache/huggingface
            printf '%s' "$HF_TOKEN" > ~/.cache/huggingface/token
          fi

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip maturin pytest transformers==4.57.1 jinja2

      - name: Build and install basetenkenizer
        run: maturin build --release --out dist && pip install dist/*.whl

      - name: Run Python tests
        run: pytest python/tests -v

      - name: Remove Hugging Face token before cache save
        if: always()
        run: rm -f ~/.cache/huggingface/token
