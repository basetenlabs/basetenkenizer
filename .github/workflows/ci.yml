name: CI

on:
  push:
    branches: [main, release/basetenkenizer]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@40e53bf063d4f87f0a6e0a83231c09bcfb22bc19 # v6

      - uses: chainguard-actions/dtolnay-rust-toolchain@7b7b95556805186e9eb5b44efdafea3a47dbaa56 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: chainguard-actions/Swatinem-rust-cache@b83da835517599f3f42d100dde7195b7edfb9e30 # v2.9.3

      - name: Check third-party license inventory
        run: python3 scripts/generate_cargo_license_inventory.py --check

      - name: Check copyright boundaries
        run: python3 scripts/check_copyright_headers.py

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@40e53bf063d4f87f0a6e0a83231c09bcfb22bc19 # v6

      - uses: chainguard-actions/dtolnay-rust-toolchain@7b7b95556805186e9eb5b44efdafea3a47dbaa56 # v1
        with:
          toolchain: stable

      - uses: chainguard-actions/Swatinem-rust-cache@b83da835517599f3f42d100dde7195b7edfb9e30 # v2.9.3

      - uses: chainguard-actions/actions-setup-python@ace3254bb5011efbd0650a7120a0441ebd1f9400 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build and install wheel
        run: maturin build --release --out dist && pip install dist/*.whl

      - name: Install Python test dependencies
        run: pip install pytest tiktoken tokenizers==0.22.2

      - name: Smoke test
        run: |
          python - <<'EOF'
          import basetenkenizer
          tok = basetenkenizer.Tokenizer.from_model("Qwen/Qwen3-0.6B")
          ids = tok.encode("hello world", add_special_tokens=False)
          assert len(ids.ids) > 0, "encode returned empty ids"
          decoded = tok.decode(list(ids.ids))
          assert decoded == "hello world", f"unexpected decode: {decoded!r}"
          print("smoke test passed")
          EOF

      - name: Run Python tests
        run: pytest python/tests -v

  patch-transformers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers: ["4.57.1", "5.3.0"]
    steps:
      - uses: chainguard-actions/actions-checkout@40e53bf063d4f87f0a6e0a83231c09bcfb22bc19 # v6

      - uses: chainguard-actions/dtolnay-rust-toolchain@7b7b95556805186e9eb5b44efdafea3a47dbaa56 # v1
        with:
          toolchain: stable

      - uses: chainguard-actions/Swatinem-rust-cache@b83da835517599f3f42d100dde7195b7edfb9e30 # v2.9.3

      - uses: chainguard-actions/actions-setup-python@ace3254bb5011efbd0650a7120a0441ebd1f9400 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build and install wheel
        run: maturin build --release --out dist && pip install dist/*.whl

      - name: Install transformers ${{ matrix.transformers }} and pytest
        run: pip install transformers==${{ matrix.transformers }} pytest jinja2

      - name: Test patch_transformers
        run: pytest python/tests/test_patch_transformers.py -v
